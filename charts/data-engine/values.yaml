imagePullSecrets: []
replicaCount: 1
containerPort: 8080
lifecyclePort: 8080
env: []
livenessProbe:
  httpGet:
    path: /api/v1/health
    port: http-web
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3
readinessProbe:
  httpGet:
    path: /api/v1/health
    port: http-web
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3
lifecycle: {}
initContainer:
  env: []
resources: {}
image:
  repository: data-engine-be
  pullPolicy: Always
  tag: latest
service:
  type: ClusterIP
  port: 80
volumeMounts: []
volumes: []
labels: {}
podAnnotations: {}
podLabels: {}
securityContext: {}
nodeSelector: {}
affinity: {}
tolerations: []
serviceAccount:
  annotations: {}
  name: ""
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80
devsecops:
  AuthorizationPolicy:
    rules: []
  RequestAuthentication:
    jwtRules: []
customPodSHA: ""
