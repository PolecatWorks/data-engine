[package]
name = "de-be"
version = "0.1.0"
edition = "2024"

[dependencies]
arrow = { version = "54.2.1", features = ["prettyprint"] }
axum = { version = "0.8.1", features = ["macros", "tokio"] }
clap = { version = "4.5.31", features = ["derive"] }
figment = { version = "0.10.19", features = ["yaml", "env"] }
parquet = { version = "54.2.1", features = ["arrow"] }
rmcp = { version = "3.5.0", features = ["server-side-http", "transport-streamable-http-server"] }
schemars = { version = "1.2", features = ["uuid1"] }
serde = { version = "1.0.218", features = ["derive"] }
serde_json = "1.0.139"
sha2 = "0.10.8"
thiserror = "2.0.11"
tokio = { version = "1.43.0", features = ["full"] }
tower = { version = "0.5.2", features = ["util"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
url = { version = "2", features = ["serde"] }
uuid = { version = "1.15.1", features = ["v4", "serde"] }

[dev-dependencies]
http-body-util = "0.1.2"
tempfile = "3.17.1"
