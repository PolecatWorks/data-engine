service:
  name: "data-engine-be"
  version: "0.1.0"
  host: "0.0.0.0"
  port: 8080
  log_level: "info"
  api_prefix: "/api/data-engine/v1"

profiler:
  max_sample_rows: 100000
  top_k_values: 10
  minhash_num_hashes: 64
  drift_relative_mean_threshold: 5.0

compute:
  query_timeout_secs: 30
  max_preview_rows: 100
  join_inclusion_threshold: 0.80

seeder:
  default_seed: 42
  default_row_count: 200

sandbox:
  backend: "process"
  python_binary: "python3"
  timeout_ms: 15000
  max_code_bytes: 65536
  max_sandbox_rows: 100000
  max_plot_points: 1000
  shm_dir: "/dev/shm"
  allowed_modules:
    - "math"
    - "statistics"
    - "json"
    - "numpy"
    - "scipy"
    - "statsmodels"
    - "pyarrow"

visuals:
  max_chart_points: 5000
  max_topology_nodes: 250
  max_topology_edges: 500
  default_ego_hops: 2
  enable_graphrag_overlay: true

mcp:
  enabled: true
  server_name: "data-engine-mcp"
  instructions: "PolecatWorks Data-Engine Model Context Protocol Server for deterministic statistical analytics, data visualization recommendation and rendering, and semantic topology exploration."
