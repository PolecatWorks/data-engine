apiVersion: v1.edp.epam.com/v1
kind: KeycloakClient
metadata:
  name: data-engine-api
  namespace: dev
spec:
  clientId: data-engine-api
  name: Data Engine Backend API
  description: Bearer-only API client for Data Engine
  realmRef:
    kind: KeycloakRealm
    name: dev
  public: false
  bearerOnly: true
  clientRolesV2:
    - name: "profile:run"
      description: "Run data profiling and hypothesis join probes"
    - name: "query:run"
      description: "Execute SQL queries against DataFusion and registered datasets"
    - name: "compute:execute"
      description: "Execute Python code in the containerized analytic sandbox"
    - name: "dataset:admin"
      description: "Register new connectors, modify lakehouse schema catalogs, grant access"
---
apiVersion: v1.edp.epam.com/v1
kind: KeycloakClient
metadata:
  name: data-engine-sa
  namespace: dev
spec:
  clientId: data-engine-sa
  name: Data Engine Service Account
  description: Confidential M2M client for Data Engine background operations
  realmRef:
    kind: KeycloakRealm
    name: dev
  public: false
  clientAuthenticatorType: client-secret
  serviceAccount:
    enabled: true
